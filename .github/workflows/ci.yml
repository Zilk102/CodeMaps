name: CI

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Windows runners default to core.autocrlf=true, which converts the LF blobs
      # Prettier expects into CRLF on disk and makes format:check fail on every file.
      - name: Disable git autocrlf
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Update version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Updating version to $TAG_VERSION"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$TAG_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Version updated to:', pkg.version);
          "

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (compile only)
        run: |
          npm run clean:build
          npm run build:renderer
          npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CodeMaps guards its own repo: the guard commands exit 1 when they list anything.
      - name: Code quality (complexity and size)
        run: npm run quality

      - name: Duplicate code
        run: npm run duplicates

      - name: Documentation coverage
        run: npm run docs

      # Dogfood: the standalone headless guard (the one setup_project wires into other projects'
      # CI) is bundled from this checkout and must pass on the CodeMaps repo itself.
      - name: Build the headless guard
        run: npm run build:guard

      - name: Headless guard on this repo
        run: node dist-guard/guard/guard.mjs check --root . --strict --format github
