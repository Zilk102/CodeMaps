version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Moscow'
    # Disable routine version-update PR spam. Security update PRs are managed
    # separately by GitHub and are not subject to this limit.
    open-pull-requests-limit: 0
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      # web-tree-sitter >= 0.26 only accepts grammars built as Emscripten side
      # modules, which the prebuilt tree-sitter-wasms grammars are not.
      # Upgrade only together with a grammar source that ships 0.26-compatible WASM.
      - dependency-name: 'web-tree-sitter'
        versions: ['>=0.26.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '06:30'
      timezone: 'Europe/Moscow'
    # Disable routine version-update PR spam. Security updates remain separate.
    open-pull-requests-limit: 0
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'automated'
